<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | vBuy</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="login">
<header id="hdr"></header>
<main class="wrap">
<form id="loginForm" class="card narrow" novalidate><h1>Sign in</h1>
<label>Email<input name="email" type="email" autocomplete="email" required></label>
<label>Password<input name="password" type="password" autocomplete="current-password" required></label>
<div class="err" id="formErr"></div><button class="btn" type="submit">Sign in</button>
<p class="muted"><a href="forgot.html">Forgot your password?</a></p>
<p class="muted">New to vBuy? <a href="register.html">Create your account</a></p>
<p class="muted">Admin? Sign in here with your admin account, then open <a href="admin.html">Admin dashboard</a>.</p></form>
</main>
<footer id="ftr"></footer>
<div id="toasts"></div>
<script src="config.js"></script><script src="jquery.min.js"></script><script src="firebase.js"></script><script src="app.js"></script>
</body></html>
